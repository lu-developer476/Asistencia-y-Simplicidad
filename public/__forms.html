<!doctype html>
<html lang="es">
  <head><meta charset="utf-8"><title>Gestoría AyS — formulario</title></head>
  <body>
    <!-- Static form definition used by Netlify Forms during deploy. -->
    <form name="consultas" data-netlify="true" data-netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="consultas">
      <input type="text" name="nombre">
      <input type="text" name="telefono">
      <input type="email" name="email">
      <select name="servicio">
        <option value=""></option>
        <option>Ley 6116 de Frente y Fachadas</option>
        <option>Habilitación de ascensores</option>
        <option>Empresas conservadoras</option>
        <option>AGIP / Obleas / IFCI</option>
        <option>Planos / Aviso de obras</option>
        <option>Calderas / Tanques / Calefacción</option>
        <option>Montajes / Herrería de obra</option>
        <option>Termografía</option>
        <option>Otro</option>
      </select>
      <textarea name="mensaje"></textarea>
      <input type="text" name="bot-field">
    </form>
  </body>
</html>
